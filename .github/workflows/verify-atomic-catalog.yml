name: Verify Ponder Source’s Atomic catalog
on:
  push:
    branches: [codex/verify-pondersource-catalog]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      HUSKY: '0'
      VITE_ATOMIC_SERVER_URL: 'http://localhost:9883'
      VITE_PLUGIN_CATALOG_URL: 'http://localhost:8000/community.json'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: ff0120e7c4678f83e863b6799455512651f34971
          path: atomic-host
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: atomic-host/browser/package.json
      - name: Prepare browser packages
        run: |
          npm install --prefix .ci-playwright --no-audit --no-fund @playwright/test@1.64.1
          npx --prefix .ci-playwright playwright install --with-deps chromium
          pnpm -C atomic-host/browser install --frozen-lockfile
          pnpm -C atomic-host/browser --filter @tomic/utils run build
          pnpm -C atomic-host/browser --filter @tomic/lib run build
          pnpm -C atomic-host/browser --filter '@tomic/data-browser^...' run build
      - name: Start isolated AtomicServer
        run: |
          docker run --detach --rm --name sharesome-atomic-demo --network host \
            -e ATOMIC_IP=127.0.0.1 -e ATOMIC_PORT=9883 -e ATOMIC_DOMAIN=localhost \
            ghcr.io/ontola/atomic-server:develop
          for i in $(seq 1 60); do
            curl -fsS http://localhost:9883/server > /tmp/atomic-info.json && break
            sleep 1
          done
          test -s /tmp/atomic-info.json
          mkdir -p atomic-host/browser/data-browser/public/wasm
          for file in atomic_wasm.js atomic_wasm_bg.wasm; do
            curl --fail --silent --show-error http://localhost:9883/wasm/$file -o atomic-host/browser/data-browser/public/wasm/$file
          done
          file atomic-host/browser/data-browser/public/wasm/atomic_wasm_bg.wasm | grep -i WebAssembly
      - name: Serve the candidate catalog and start the unmodified host
        run: |
          curl -fsS https://raw.githubusercontent.com/ontola/atomic-plugins/81db23bbc87a6f41353272f2941e5888b5a77904/integrations/catalog.json -o upstream-catalog.json
          NODE_PATH="$PWD/.ci-playwright/node_modules" node scripts/verify-atomic-catalog.cjs serve > /tmp/sharesome-catalog.log 2>&1 &
          pnpm -C atomic-host/browser/data-browser dev --host 127.0.0.1 --port 6747 > /tmp/atomic-vite.log 2>&1 &
          for i in $(seq 1 75); do
            curl -fsS http://localhost:6747/ >/dev/null && curl -fsS http://localhost:8000/catalog.json >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Verify install and persistence in Chromium
        run: NODE_PATH="$PWD/.ci-playwright/node_modules" node scripts/verify-atomic-catalog.cjs
      - name: Diagnose failures
        if: failure()
        run: |
          test ! -f /tmp/atomic-vite.log || tail -100 /tmp/atomic-vite.log
          test ! -f /tmp/sharesome-catalog.log || tail -50 /tmp/sharesome-catalog.log
          docker logs sharesome-atomic-demo 2>&1 | tail -80 || true
